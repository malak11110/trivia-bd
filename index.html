<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Khadija's Bye-Bye Teens Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Gochi+Hand&family=Baloo+Bhaijaan+2:wght@600;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: a sticker-sheet page. Doodled header, a live scoreboard strip, then one outlined "worksheet" card that changes per game step. Section bars color-code the four games. */
:root {
  --paper: #ffffff;
  --ink: #2b2233;
  --ink-soft: #6c6278;
  --pink: #ff3d8b;  --pink-soft: #ffe0ec;
  --yellow: #ffc928; --yellow-soft: #fff3c2;
  --purple: #9b6bf0; --purple-soft: #ece2ff;
  --green: #4fae3a; --green-soft: #def5d5;
  --blue: #3d8bff; --orange: #ff8a2b; --red: #f0414f;
  --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --hand: "Gochi Hand", "Comic Sans MS", cursive;
  --body: "Nunito", system-ui, -apple-system, sans-serif;
  --arabic: "Baloo Bhaijaan 2", "Noto Naskh Arabic", "Geeza Pro", Tahoma, sans-serif;
  --blue-soft: #dcebff; --orange-soft: #ffe6d1;
  --c: var(--pink); --c-soft: var(--pink-soft);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--paper); color: var(--ink); font: 600 16px/1.45 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 48px;
}
.wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 18px; }

/* Header */
header { position: relative; text-align: center; padding: 18px 46px 6px; overflow: hidden; }
.doodle { position: absolute; width: 44px; height: 44px; }
.eyebrow { font: 400 22px/1 var(--hand); color: var(--purple); margin: 0; }
h1 { font: 700 clamp(38px, 10vw, 62px)/0.95 var(--display); color: var(--pink); margin: 4px 0 8px; text-wrap: balance; letter-spacing: -0.01em; }
h1 em { font-style: normal; color: var(--ink); display: block; font-size: .62em; }
.tag { font: 400 21px/1.25 var(--hand); margin: 0 auto; max-width: 30ch; color: var(--ink); }
.tag b { font-weight: 400; color: var(--green); }
.tag i { font-style: normal; color: var(--pink); }

/* Scoreboard */
.board { display: grid; gap: 10px; }
.board[hidden] { display: none !important; }
.teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.team {
  border: 2.5px solid var(--ink); border-radius: 16px; padding: 8px 10px; background: var(--tsoft);
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 6px; min-width: 0;
}
.team.now { box-shadow: 0 0 0 3px var(--paper), 0 0 0 6px var(--tc); }
.team .nm { font: 700 15px/1.15 var(--display); overflow-wrap: anywhere; min-width: 0; }
.team .sc { font: 700 26px/1 var(--display); font-variant-numeric: tabular-nums; grid-row: span 2; }
.team .adj { display: flex; gap: 4px; }
.team .adj button { width: 26px; height: 22px; border-radius: 8px; border: 2px solid var(--ink); background: var(--paper); font: 800 14px/1 var(--body); color: var(--ink); cursor: pointer; padding: 0; }
.board-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font: 400 18px var(--hand); color: var(--ink-soft); }

/* Worksheet card */
.sheet { border: 2.5px solid var(--ink); border-radius: 22px; overflow: hidden; background: var(--paper); }
.bar { background: var(--c); color: var(--ink); text-align: center; font: 700 17px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; padding: 11px 14px; border-bottom: 2.5px solid var(--ink); }
.body { padding: 20px; display: grid; gap: 16px; }
.lead { font: 700 clamp(24px, 6vw, 32px)/1.1 var(--display); margin: 0; text-align: center; text-wrap: balance; }
.note { font: 400 20px/1.3 var(--hand); color: var(--ink-soft); margin: 0; text-align: center; }

label.f { display: grid; gap: 4px; font: 800 13px var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
input[type=text] { font: 700 17px var(--body); color: var(--ink); border: 2.5px solid var(--ink); border-radius: 12px; padding: 10px 12px; width: 100%; background: var(--paper); }
input[type=text]:focus-visible { outline: 3px solid var(--c); outline-offset: 2px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 460px) { .grid2 { grid-template-columns: 1fr; } }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { flex: 1; min-width: 64px; }

button { font-family: inherit; }
.chipbtn { border: 2.5px solid var(--ink); background: var(--paper); color: var(--ink); border-radius: 12px; padding: 9px 10px; font: 800 15px var(--body); cursor: pointer; }
.chipbtn[aria-pressed="true"] { background: var(--c); }
.btn {
  font: 700 19px/1 var(--display); color: var(--ink); background: var(--c); border: 2.5px solid var(--ink);
  border-radius: 999px; padding: 14px 26px; cursor: pointer; box-shadow: 0 4px 0 var(--ink); justify-self: center;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn.ghost { background: var(--paper); }
.btn.sm { font-size: 15px; padding: 9px 16px; box-shadow: 0 3px 0 var(--ink); }
button:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

/* Game choice cards */
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 460px) { .modes { grid-template-columns: 1fr; } }
.mode {
  text-align: left; border: 2.5px solid var(--ink); border-radius: 18px; background: var(--msoft);
  padding: 14px; cursor: pointer; display: grid; gap: 4px; color: var(--ink); transition: transform .12s;
}
.mode:hover { transform: rotate(-1deg) translateY(-2px); }
.mode .t { font: 700 21px/1.1 var(--display); display: flex; align-items: center; gap: 8px; }
.mode .t i { width: 14px; height: 14px; border-radius: 50%; background: var(--m); border: 2px solid var(--ink); flex: none; }
.mode .d { font-size: 14.5px; color: var(--ink-soft); }
.mode .p { font: 400 18px var(--hand); color: var(--ink); }
div.mode { cursor: default; }
div.mode:hover { transform: none; }

/* Timed play */
.timer { display: grid; gap: 6px; }
.timer .row { display: flex; justify-content: space-between; font: 700 18px var(--display); font-variant-numeric: tabular-nums; }
.track { height: 16px; border: 2.5px solid var(--ink); border-radius: 999px; overflow: hidden; background: var(--paper); }
.fill { height: 100%; background: var(--c); width: 100%; }
.timer.hurry .fill { background: var(--red); }
.word {
  border: 2.5px dashed var(--ink); border-radius: 18px; background: var(--c-soft);
  padding: 26px 16px; text-align: center; display: grid; gap: 8px; min-height: 170px; align-content: center;
}
.word .cat { justify-self: center; font: 800 12px var(--body); letter-spacing: .1em; text-transform: uppercase; background: var(--paper); border: 2px solid var(--ink); border-radius: 999px; padding: 3px 10px; }
.word .w { font: 700 clamp(30px, 9vw, 46px)/1.05 var(--display); text-wrap: balance; overflow-wrap: anywhere; }
.word .w.ar { font-family: var(--arabic); font-weight: 800; line-height: 1.3; }
.word .sub { font: 700 16px var(--body); color: var(--ink-soft); }
.signals { margin: 0; padding: 12px 14px 12px 32px; border: 2px dashed var(--ink); border-radius: 14px; background: var(--c-soft); display: grid; gap: 4px; font-size: 15px; }
.actions { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }
.actions .btn { justify-self: stretch; }
.skip { background: var(--paper) !important; }
.got { background: var(--green) !important; color: #fff !important; text-shadow: 0 1px 0 rgba(0,0,0,.25); }

/* Trivia */
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 460px) { .opts { grid-template-columns: 1fr; } }
.opt { border: 2.5px solid var(--ink); border-radius: 14px; background: var(--paper); padding: 13px 12px; font: 800 16px/1.25 var(--body); color: var(--ink); text-align: left; cursor: pointer; min-height: 54px; }
.opt:hover:not(:disabled) { background: var(--c-soft); }
.opt:disabled { cursor: default; opacity: .55; }
.opt.right { background: var(--green-soft); border-color: var(--green); opacity: 1; }
.opt.wrong { background: #ffe1e3; border-color: var(--red); opacity: 1; }
.q { font: 700 clamp(22px, 5.5vw, 28px)/1.15 var(--display); margin: 0; text-wrap: balance; }
.prog { display: flex; justify-content: space-between; font: 800 13px var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }

/* Reverse trivia */
.answer { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 12px; }
.answer span { font: 800 15px var(--body); }
.answer strong { border: 2.5px solid var(--ink); background: var(--c-soft); border-radius: 12px; padding: 14px; text-align: center; font: 700 clamp(26px, 7vw, 36px)/1.1 var(--display); }
.judge { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.judge .btn { justify-self: stretch; padding-inline: 8px; font-size: 16px; }

/* Summary lists */
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.list li { display: flex; gap: 10px; align-items: baseline; border-bottom: 2px dashed #e4dde9; padding-bottom: 6px; }
.list li b { width: 22px; flex: none; text-align: center; }
.ok { color: var(--green); } .no { color: var(--red); }

.podium { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.podium li { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 10px; border: 2.5px solid var(--ink); border-radius: 14px; padding: 10px 14px; background: var(--tsoft); }
.podium .rk { font: 700 22px var(--display); }
.podium .nm { font: 700 18px var(--display); overflow-wrap: anywhere; min-width: 0; }
.podium .sc { font: 700 24px var(--display); font-variant-numeric: tabular-nums; }

.stickers { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
.sticky { font: 400 21px/1.15 var(--hand); padding: 10px 14px; border: 2px solid var(--ink); background: var(--yellow-soft); transform: rotate(-3deg); box-shadow: 3px 3px 0 var(--ink); }
.sticky.p { background: var(--pink-soft); transform: rotate(2.5deg); }
.sticky.g { background: var(--green-soft); transform: rotate(-1.5deg); }

#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } .mode:hover { transform: none; } }
/* Phones joining */
.lobby { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; border: 2.5px dashed var(--ink); border-radius: 18px; padding: 14px; background: var(--yellow-soft); }
@media (max-width: 460px) { .lobby { grid-template-columns: 1fr; text-align: center; } }
.codebox { display: grid; gap: 2px; justify-items: center; }
.codebox .lbl { font: 800 12px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
.codebox .code { font: 700 52px/1 var(--display); letter-spacing: .08em; font-variant-numeric: tabular-nums; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 14px; padding: 6px 14px; }
.lobbytext { min-width: 0; display: grid; gap: 8px; }
.lobbytext p { margin: 0; }
.phones { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
@media (max-width: 460px) { .phones { justify-content: center; } }
.phones li { border: 2px solid var(--ink); background: var(--paper); border-radius: 999px; padding: 2px 10px; font-weight: 800; font-size: 14px; }
.phones li.none { border-style: dashed; color: var(--ink-soft); }
.netline { font: 800 14px var(--body); color: var(--ink); background: var(--yellow-soft); border: 2px solid var(--ink); border-radius: 999px; padding: 3px 12px; }
.pickers { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.linkbtn { background: none; border: 0; color: var(--ink-soft); font: 700 14px var(--body); text-decoration: underline; cursor: pointer; justify-self: center; padding: 6px; }
.note.small { font-size: 17px; }
.err { margin: 0; color: var(--red); font-weight: 800; text-align: center; }
.btn:disabled { opacity: .5; cursor: default; }
input[inputmode=numeric] { font: 700 28px var(--display); letter-spacing: .2em; text-align: center; }
body[data-role="player"] header { padding-top: 6px; }
body[data-role="player"] header .tag, body[data-role="player"] header .doodle { display: none; }
body[data-role="player"] h1 { font-size: 30px; }
</style>

</head>
<body>
<canvas id="confetti" aria-hidden="true"></canvas>
<main class="wrap">
  <header>
    <!-- sun -->
    <svg class="doodle" style="left:0;top:8px;width:52px;height:52px" viewBox="0 0 60 60" aria-hidden="true">
      <g stroke="#2b2233" stroke-width="3" stroke-linecap="round"><line x1="30" y1="3" x2="30" y2="11"/><line x1="30" y1="49" x2="30" y2="57"/><line x1="3" y1="30" x2="11" y2="30"/><line x1="49" y1="30" x2="57" y2="30"/><line x1="11" y1="11" x2="16" y2="16"/><line x1="44" y1="44" x2="49" y2="49"/><line x1="49" y1="11" x2="44" y2="16"/><line x1="11" y1="49" x2="16" y2="44"/></g>
      <circle cx="30" cy="30" r="15" fill="#ffc928" stroke="#2b2233" stroke-width="3"/><circle cx="25" cy="28" r="2" fill="#2b2233"/><circle cx="35" cy="28" r="2" fill="#2b2233"/><path d="M24 34 q6 5 12 0" fill="none" stroke="#2b2233" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    <!-- heart -->
    <svg class="doodle" style="right:4px;top:6px" viewBox="0 0 50 50" aria-hidden="true"><path d="M25 43 C8 31 4 22 8 14 c4-8 14-8 17 1 c3-9 13-9 17-1 c4 8 0 17-17 29z" fill="#ff3d8b" stroke="#2b2233" stroke-width="3" stroke-linejoin="round"/><path d="M13 17 q2-4 6-4" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
    <!-- party hat -->
    <svg class="doodle" style="left:2px;bottom:4px" viewBox="0 0 50 50" aria-hidden="true"><path d="M25 6 L40 44 H10 Z" fill="#9b6bf0" stroke="#2b2233" stroke-width="3" stroke-linejoin="round"/><path d="M19 22 L31 26 M15 32 L35 38" stroke="#ffc928" stroke-width="4" stroke-linecap="round"/><circle cx="25" cy="6" r="5" fill="#ff3d8b" stroke="#2b2233" stroke-width="2.5"/></svg>
    <!-- cherries -->
    <svg class="doodle" style="right:0;bottom:6px" viewBox="0 0 50 50" aria-hidden="true"><path d="M17 33 Q22 14 34 6 M33 33 Q32 18 34 6" stroke="#4fae3a" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="16" cy="36" r="9" fill="#f0414f" stroke="#2b2233" stroke-width="3"/><circle cx="34" cy="36" r="9" fill="#f0414f" stroke="#2b2233" stroke-width="3"/><circle cx="13" cy="33" r="2" fill="#fff"/><circle cx="31" cy="33" r="2" fill="#fff"/></svg>
    <!-- sparkle stars -->
    <svg class="doodle" style="left:54px;top:2px;width:22px;height:22px" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1 L12 8 L19 10 L12 12 L10 19 L8 12 L1 10 L8 8 Z" fill="none" stroke="#2b2233" stroke-width="2" stroke-linejoin="round"/></svg>
    <svg class="doodle" style="right:52px;top:58px;width:26px;height:26px" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1 L12.6 7 L19 7.6 L14 11.8 L15.6 18.5 L10 15 L4.4 18.5 L6 11.8 L1 7.6 L7.4 7 Z" fill="#3d8bff" stroke="#2b2233" stroke-width="1.8" stroke-linejoin="round"/></svg>

    <p class="eyebrow">Khadija's 20th birthday ♡</p>
    <h1>Bye-Bye Teens<em>Game Night</em></h1>
    <p class="tag">Teams take turns. <b>Explain it</b>, act it out, play Kataflam, or <i>answer it</i>. Most points wins!</p>
  </header>

  <section class="board" id="board" hidden aria-label="Scoreboard">
    <div class="teams" id="teams"></div>
    <div class="board-foot"><span id="turnline"></span><span id="netline" class="netline"></span><button class="btn ghost sm" id="endgame">End game &amp; crown the winner</button></div>
  </section>

  <section class="sheet" id="sheet" aria-live="polite"></section>
</main>

  if ((d.t === "got" || d.t === "skip") && S.phase === "play" && R && R.conn && R.conn.peer === conn.peer && d.n === R.n) next(d.t === "got");
}
function sendTo(conn, msg){ try { if (conn && conn.open) conn.send(msg); } catch (e) {} }
function broadcast(){
  const msg = { t:"scores", teams:S.teams.map(t => ({ name:t.name, score:t.score })), up:(S.phase === "end" || S.phase === "setup") ? "" : team().name };
  conns.forEach(c => sendTo(c.conn, msg));
}
function netText(){
  if (netStatus === "none") return "Phones can't join (no internet). You can still play on this screen.";
  if (netStatus === "online") return `Join code ${S.code} · ${conns.size} phone${conns.size === 1 ? "" : "s"} connected`;
  if (netStatus === "offline") return "Phones can't connect right now. Trying again…";
  return "Getting the join code ready…";
}
function refreshNet(){
  const nl = $("netline"); if (nl) nl.textContent = netText();
  const ph = $("phones");
  if (ph) ph.innerHTML = conns.size ? [...conns.values()].map(c => `<li>${esc(c.name)}</li>`).join("") : `<li class="none">No phones yet</li>`;
  const ls = $("lobbystatus"); if (ls) ls.textContent = netStatus === "online" ? "Ready for phones" : netText();
  if (S.role === "host" && S.phase === "ready") ready();
}

/* ---------- Scoreboard ---------- */
function renderBoard(){
  const show = S.phase !== "setup";
  $("board").hidden = !show;
  if (!show) return;
  $("teams").innerHTML = S.teams.map((t, i) => `
    <div class="team ${i === S.turn && S.phase !== "end" ? "now" : ""}" style="--tc:var(${TEAM_COLORS[i][0]});--tsoft:var(${TEAM_COLORS[i][1]})">
      <span class="nm">${esc(t.name)}</span><span class="sc">${t.score}</span>
      <span class="adj"><button id="minus-${i}" aria-label="Take a point from ${esc(t.name)}">−</button><button id="plus-${i}" aria-label="Give a point to ${esc(t.name)}">+</button></span>
    </div>`).join("");
  S.teams.forEach((t, i) => {
    $("minus-" + i).onclick = () => { t.score = Math.max(0, t.score - 1); save(); renderBoard(); };
    $("plus-" + i).onclick = () => { t.score++; save(); renderBoard(); };
  });
  $("turnline").textContent = S.phase === "end" ? "Game over!" : `Up now: ${team().name}`;
  $("endgame").hidden = S.phase === "end";
  refreshNet();
}
$("endgame").onclick = () => { stopTimer(); if (R && R.conn) sendTo(R.conn, { t:"done", pts:R.pts, team:team().name }); S.phase = "end"; save(); render(); };

/* ---------- Screens ---------- */
function render(){
  document.body.dataset.role = S.role || "";
  if (S.role === "player") { $("board").hidden = true; renderPlayer(); return; }
  if (!S.role) { $("board").hidden = true; home(); return; }
  renderBoard();
  ({ setup, pick, ready, play, trivia, reverse, turnEnd, end })[S.phase]();
}

function home(){

    <div class="bar">Which screen is this?</div>

        <button class="mode" id="role-player" style="--m:var(--purple);--msoft:var(--purple-soft)"><span class="t"><i></i>Join as a player</span><span class="d">For guests' phones. When it's your turn to explain or act, your secret word shows up here.</span><span class="p">everyone else</span></button>
      </div>

  $("role-player").onclick = () => { S.role = "player"; P.phase = "join"; render(); };

      <label class="f">Seconds per turn<div class="seg">${[45,60,90].map(k => `<button class="chipbtn" id="secs-${k}" aria-pressed="${k === S.secs}">${k}s</button>`).join("")}</div></label>

function armLeave(){

const acting = () => R.mode === "act" || R.mode === "kataflam";
const drawWord = () => draw(MODES[R.mode].pool || R.mode, MODES[R.mode].deck());
function ready(){

function go(conn){
  R.conn = conn; R.lost = false;
  S.phase = "play"; R.end = performance.now() + S.secs * 1000; R.word = drawWord(); R.n = 1;
  render(); sendWord(); startTimer();
}
function sendWord(){ if (R.conn) sendTo(R.conn, { t:"turn", n:R.n, word:R.word, left:R.end - performance.now(), total:S.secs * 1000, mode:MODES[R.mode].name, c:MODES[R.mode].c, s:MODES[R.mode].s, acting:acting(), team:team().name, count:R.log.filter(l => l.ok).length }); }

function play(){
  const m = MODES[R.mode];
  const who = R.conn && conns.get(R.conn.peer);
  sheet.innerHTML = `
    <div class="bar">${m.name} · ${esc(team().name)}</div>
    <div class="body">
      <div class="timer" id="timer"><div class="row"><span id="left">${S.secs}s</span><span>Guessed: <span id="count">${R.log.filter(l => l.ok).length}</span></span></div><div class="track"><div class="fill" id="fill"></div></div></div>
      ${who ? `<div class="word"><span class="cat">On ${esc(who.name)}'s phone</span><span class="w">🤫</span><span class="sub">${esc(team().name)}, start guessing!</span></div>`
            : `${R.lost ? `<p class="note">The phone disconnected, so the word is on this screen now.</p>` : ""}<div class="word"><span class="cat">${esc(R.word[1])}</span>${wordHTML(R.word)}</div>`}
      <div class="actions"><button class="btn skip" id="skip">Skip</button><button class="btn got" id="got">Got it! ✓</button></div>
      ${who ? `<p class="note small">The player taps these on their phone. Use them here only if their phone stops working.</p>` : ""}
    </div>`;
  $("skip").onclick = () => next(false);
  $("got").onclick = () => next(true);
  tickTimer();
}
function next(ok){
  if (S.phase !== "play") return;
  R.log.push({ w:R.word[2] ? `${R.word[0]} (${R.word[2]})` : R.word[0], ok });
  if (ok) { R.pts += acting() ? 2 : 1; burst(18); beep(880, .08); }
  R.word = drawWord(); R.n++;
  play(); sendWord();
}

let timerId = null, lastBeep = null;
function startTimer(){ stopTimer(); lastBeep = null; timerId = setInterval(tickTimer, 100); }
function stopTimer(){ if (timerId) clearInterval(timerId); timerId = null; }
function tickTimer(){
  if (S.phase !== "play") return;
  const ms = Math.max(0, R.end - performance.now()), s = Math.ceil(ms / 1000);
  const left = $("left"), fill = $("fill"), box = $("timer");
  if (left) left.textContent = s + "s";
  if (fill) fill.style.width = (ms / (S.secs * 1000) * 100) + "%";
  if (box) box.classList.toggle("hurry", s <= 10);
  if (s <= 5 && s > 0 && s !== lastBeep) { lastBeep = s; beep(520, .1); }
  if (ms <= 0) { stopTimer(); beep(200, .5); finishTurn(); }
}

function trivia(){
  const Q = R.qs[R.i];
  sheet.innerHTML = `
    <div class="bar">Trivia · ${esc(team().name)}</div>
    <div class="body">
      <div class="prog"><span>Question ${R.i + 1} of 3</span><span>+${R.pts} this turn</span></div>

    </div>`;
  Q.o.forEach((_, k) => $(`opt-${R.i}-${k}`).onclick = () => {

    Q.o.forEach((_, n) => { const b = $(`opt-${R.i}-${n}`); b.disabled = true; if (n === Q.a) b.classList.add("right"); else if (n === k) b.classList.add("wrong"); });
    R.log.push({ w:Q.q, ok });
    if (ok) { R.pts++; burst(30); beep(880, .1); } else beep(220, .25);
    $("after").innerHTML = `<p class="note">${ok ? "Correct! +1" : "Not this time. The answer was " + esc(Q.o[Q.a]) + "."}</p><button class="btn" id="tnext">${R.i < 2 ? "Next question" : "Finish turn"}</button>`;
    $("tnext").onclick = () => { R.i++; R.i < 3 ? trivia() : finishTurn(); };
    $("tnext").focus({ preventScroll:true });
  });
}

function reverse(){
  const A = R.qs[R.i];
  sheet.innerHTML = `
    <div class="bar">Reverse Trivia · ${esc(team().name)}</div>

function finishTurn(){

      <button class="btn" id="nextteam">Next up: ${esc(nextTeam.name)}</button>

      <div class="stickers"><span class="sticky p">Happy 20th, Khadija! ♡</span><span class="sticky g">bye-bye teens, hello twenties</span></div>

    </div>`;
  $("back").onclick = () => { S.phase = "pick"; save(); render(); };
  $("again").onclick = () => { S.teams.forEach(t => t.score = 0); S.turn = 0; S.phase = "setup"; save(); render(); };
  burst(260);
}

/* ---------- Player phone ---------- */
let ppeer = null, pconn = null, pTimer = null, pTimeout = null;
function playerJoin(){
  P.phase = "connecting"; P.err = ""; renderPlayer();
  if (!window.Peer) { P.phase = "join"; P.err = "This phone can't connect. Check your internet and reload the page."; renderPlayer(); return; }
  try { if (ppeer) ppeer.destroy(); } catch (e) {}
  ppeer = new Peer({ debug:0 });
  clearTimeout(pTimeout);
  pTimeout = setTimeout(() => { if (P.phase === "connecting") { P.phase = "join"; P.err = "That took too long. Check the code on the TV and your internet, then try again."; try { ppeer.destroy(); } catch (e) {} renderPlayer(); } }, 15000);
  ppeer.on("open", () => {
    pconn = ppeer.connect("khadija-bbt-" + P.code, { reliable:true });
    pconn.on("open", () => { clearTimeout(pTimeout); sendTo(pconn, { t:"hello", name:P.name }); P.phase = "wait"; savePlayer(); renderPlayer(); });
    pconn.on("data", onPlayerData);
    pconn.on("close", () => { if (["wait","turn","done"].includes(P.phase)) { P.phase = "lost"; stopPTimer(); renderPlayer(); setTimeout(() => { if (P.phase === "lost") playerJoin(); }, 3000); } });
  });
  ppeer.on("error", err => {
    clearTimeout(pTimeout);
    if (P.phase === "lost") { setTimeout(() => { if (P.phase === "lost") playerJoin(); }, 4000); return; }
    P.phase = "join";
    P.err = err.type === "peer-unavailable" ? "There's no game with that code. Check the code on the TV." : "Couldn't connect. Check your internet and try again.";
    renderPlayer();
  });
}
function onPlayerData(d){
  if (!d || typeof d !== "object") return;
  if (d.t === "scores") { P.teams = d.teams || []; P.up = d.up || ""; if (P.phase === "wait") renderPlayer(); }
  if (d.t === "turn") { P.phase = "turn"; P.word = d.word; P.n = d.n; P.end = performance.now() + d.left; P.total = d.total; P.mode = d.mode; P.c = d.c; P.s = d.s; P.acting = d.acting; P.team = d.team; P.count = d.count; P.busy = false; renderPlayer(); startPTimer(); beep(660, .08); }
  if (d.t === "done") { stopPTimer(); P.phase = "done"; P.pts = d.pts; P.team = d.team; renderPlayer(); if (d.pts) burst(80); }
}
function startPTimer(){ stopPTimer(); pTimer = setInterval(tickP, 100); tickP(); }
function stopPTimer(){ if (pTimer) clearInterval(pTimer); pTimer = null; }
function tickP(){
  const ms = Math.max(0, P.end - performance.now()), s = Math.ceil(ms / 1000);
  const left = $("pleft"), fill = $("pfill"), box = $("ptimer");
  if (left) left.textContent = s + "s";
  if (fill) fill.style.width = (ms / P.total * 100) + "%";
  if (box) box.classList.toggle("hurry", s <= 10);
}
function renderPlayer(){
  if (P.phase === "join" || P.phase === "connecting") {
    tint("--purple", "--purple-soft");
    const hashCode = (location.hash.match(/^#(\d{4})$/) || [])[1];
    sheet.innerHTML = `
      <div class="bar">Join the game</div>
      <div class="body">
        <p class="note">Type your name and the 4-digit code shown on the TV.</p>
        <label class="f">Your name<input type="text" id="pname" maxlength="20" value="${esc(P.name)}" autocomplete="given-name"></label>
        <label class="f">Join code<input type="text" id="pcode" inputmode="numeric" maxlength="4" value="${esc(P.code || hashCode || "")}" placeholder="0000"></label>
        ${P.err ? `<p class="err">${esc(P.err)}</p>` : ""}
        <button class="btn" id="pjoin" ${P.phase === "connecting" ? "disabled" : ""}>${P.phase === "connecting" ? "Joining…" : "Join"}</button>
        <button class="linkbtn" id="pback">Go back</button>
      </div>`;
    $("pjoin").onclick = () => {
      unlockAudio();
      const name = $("pname").value.trim(), code = $("pcode").value.replace(/\D/g, "");
      if (!name) { P.err = "Type your name first."; renderPlayer(); return; }
      if (code.length !== 4) { P.name = name; P.err = "The join code has 4 numbers. Look at the TV."; renderPlayer(); return; }
      P.name = name; P.code = code; playerJoin();
    };
    $("pback").onclick = () => { try { if (ppeer) ppeer.destroy(); } catch (e) {} S.role = null; P = { phase:"join", name:P.name, code:"", teams:[], up:"", err:"" }; try { localStorage.removeItem(PKEY); } catch (e) {} render(); };
    return;
  }
  if (P.phase === "lost") {
    sheet.innerHTML = `<div class="bar">Reconnecting…</div><div class="body"><p class="lead">Lost the connection</p><p class="note">Trying to join game ${esc(P.code)} again. Keep this page open.</p><button class="linkbtn" id="pleave">Join a different game</button></div>`;
    $("pleave").onclick = leavePlayer;
    return;
  }
  if (P.phase === "turn") {
    tint(P.c || "--pink", P.s || "--pink-soft");
    sheet.innerHTML = `
      <div class="bar">${esc(P.mode)} · Your turn!</div>
      <div class="body">
        <div class="timer" id="ptimer"><div class="row"><span id="pleft"></span><span>${esc(P.team)}</span></div><div class="track"><div class="fill" id="pfill"></div></div></div>
        <div class="word"><span class="cat">${esc(P.word[1])}</span>${wordHTML(P.word)}</div>
        <p class="note small">${P.acting ? "Act it out. No talking, no sounds!" : "Explain it without saying the name or any word in it."}</p>
        <div class="actions"><button class="btn skip" id="pskip" ${P.busy ? "disabled" : ""}>Skip</button><button class="btn got" id="pgot" ${P.busy ? "disabled" : ""}>Got it! ✓</button></div>
      </div>`;
    const send = t => { if (P.busy) return; P.busy = true; $("pskip").disabled = $("pgot").disabled = true; sendTo(pconn, { t, n:P.n }); };
    $("pskip").onclick = () => send("skip");
    $("pgot").onclick = () => send("got");
    tickP();
    return;
  }
  if (P.phase === "done") {
    tint("--green", "--green-soft");
    sheet.innerHTML = `
      <div class="bar">Time's up!</div>
      <div class="body">
        <p class="lead">${esc(P.team)} got +${P.pts}</p>
        <p class="note">${P.pts ? "Great job!" : "Next time!"} Look at the TV for the scores.</p>
        <button class="btn" id="pok">OK</button>
      </div>`;
    $("pok").onclick = () => { P.phase = "wait"; renderPlayer(); };
    return;
  }
  // wait
  tint("--purple", "--purple-soft");
  sheet.innerHTML = `
    <div class="bar">You're in, ${esc(P.name)}!</div>
    <div class="body">
      <p class="lead">Watch the TV</p>
      <p class="note">When it's your turn to explain or act, your secret word pops up here. Don't show anyone!</p>
      ${P.teams.length ? `<ol class="podium">${P.teams.map((t, i) => `<li style="--tsoft:var(${TEAM_COLORS[i][1]})"><span class="rk">${t.name === P.up ? "▶" : i + 1}</span><span class="nm">${esc(t.name)}</span><span class="sc">${t.score}</span></li>`).join("")}</ol>` : ""}
      ${P.up ? `<p class="note">Up now: <b>${esc(P.up)}</b></p>` : ""}
      <button class="linkbtn" id="pleave">Leave this game</button>
    </div>`;
  $("pleave").onclick = leavePlayer;
}
function leavePlayer(){
  const b = $("pleave");
  if (b && !b.dataset.armed) { b.dataset.armed = "1"; b.textContent = "Tap again to leave"; return; }
  try { if (ppeer) ppeer.destroy(); } catch (e) {} stopPTimer();
  P = { phase:"join", name:P.name, code:"", teams:[], up:"", err:"" };
  try { localStorage.removeItem(PKEY); } catch (e) {}
  renderPlayer();
}

/* ---------- Sound ---------- */
let ac = null;
function unlockAudio(){ try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume && ac.resume(); } catch (e) {} }
function beep(f, d){
  if (!ac) return;
  try { const o = ac.createOscillator(), g = ac.createGain(); o.type = "triangle"; o.frequency.value = f;
    g.gain.setValueAtTime(.15, ac.currentTime); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d); } catch (e) {}
}

/* ---------- Confetti ---------- */
const cv = $("confetti"), cx = cv.getContext("2d");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const COLS = ["#ff3d8b","#ffc928","#9b6bf0","#4fae3a","#3d8bff","#ff8a2b","#f0414f"];
let bits = [], running = false;
function size(){ cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
addEventListener("resize", size); size();
function burst(n){
  if (reduce) return;
  for (let k = 0; k < n; k++) bits.push({ x:innerWidth * (.15 + Math.random() * .7), y:innerHeight * .3, vx:(Math.random() - .5) * 10,
    vy:-Math.random() * 11 - 3, r:Math.random() * 6 + 4, c:COLS[k % COLS.length], a:Math.random() * 6, s:(Math.random() - .5) * .3, round:Math.random() < .3 });
  if (!running) { running = true; requestAnimationFrame(tick); }
}
function tick(){
  const d = devicePixelRatio; cx.clearRect(0, 0, cv.width, cv.height);
  bits.forEach(b => { b.vy += .28; b.x += b.vx; b.y += b.vy; b.vx *= .99; b.a += b.s;
    cx.save(); cx.translate(b.x * d, b.y * d); cx.rotate(b.a); cx.fillStyle = b.c;
    if (b.round) { cx.beginPath(); cx.arc(0, 0, b.r * d / 2, 0, 7); cx.fill(); } else cx.fillRect(-b.r * d / 2, -b.r * d / 4, b.r * d, b.r * d / 2);
    cx.restore(); });
  bits = bits.filter(b => b.y < innerHeight + 30);
  if (bits.length) requestAnimationFrame(tick); else { running = false; cx.clearRect(0, 0, cv.width, cv.height); }
}

if (S.role === "host") openHostPeer();
render();
if (S.role === "player" && P.code) playerJoin();
</script>
