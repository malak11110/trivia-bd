<html lang="en">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Khadija's Bye-Bye Teens Games</title>

<style>
/* Layout: a sticker-sheet page. Doodled header, a live scoreboard strip, then one outlined "worksheet" card that changes per game step. Section bars color-code the four games. */
:root {
  --paper: #ffffff;
  --ink: #2b2233;
  --ink-soft: #6c6278;
  --pink: #ff3d8b;  --pink-soft: #ffe0ec;
  --yellow: #ffc928; --yellow-soft: #fff3c2;
  --purple: #9b6bf0; --purple-soft: #ece2ff;
  --green: #4fae3a; --green-soft: #def5d5;
  --blue: #3d8bff; --orange: #ff8a2b; --red: #f0414f;
  --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --hand: "Gochi Hand", "Comic Sans MS", cursive;
  --body: "Nunito", system-ui, -apple-system, sans-serif;
  --arabic: "Baloo Bhaijaan 2", "Noto Naskh Arabic", "Geeza Pro", Tahoma, sans-serif;
  --blue-soft: #dcebff; --orange-soft: #ffe6d1;
  --c: var(--pink); --c-soft: var(--pink-soft);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--paper); color: var(--ink); font: 600 16px/1.45 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 48px;
}
.wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 18px; }

/* Header */
header { position: relative; text-align: center; padding: 18px 46px 6px; overflow: hidden; }
.doodle { position: absolute; width: 44px; height: 44px; }
.eyebrow { font: 400 22px/1 var(--hand); color: var(--purple); margin: 0; }
h1 { font: 700 clamp(38px, 10vw, 62px)/0.95 var(--display); color: var(--pink); margin: 4px 0 8px; text-wrap: balance; letter-spacing: -0.01em; }
h1 em { font-style: normal; color: var(--ink); display: block; font-size: .62em; }
.tag { font: 400 21px/1.25 var(--hand); margin: 0 auto; max-width: 30ch; color: var(--ink); }
.tag b { font-weight: 400; color: var(--green); }
.tag i { font-style: normal; color: var(--pink); }

/* Scoreboard */
.board { display: grid; gap: 10px; }
.board[hidden] { display: none !important; }
.teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.team {
  border: 2.5px solid var(--ink); border-radius: 16px; padding: 8px 10px; background: var(--tsoft);
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 6px; min-width: 0;
}
.team.now { box-shadow: 0 0 0 3px var(--paper), 0 0 0 6px var(--tc); }
.team .nm { font: 700 15px/1.15 var(--display); overflow-wrap: anywhere; min-width: 0; }
.team .sc { font: 700 26px/1 var(--display); font-variant-numeric: tabular-nums; grid-row: span 2; }
.team .adj { display: flex; gap: 4px; }
.team .adj button { width: 26px; height: 22px; border-radius: 8px; border: 2px solid var(--ink); background: var(--paper); font: 800 14px/1 var(--body); color: var(--ink); cursor: pointer; padding: 0; }
.board-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font: 400 18px var(--hand); color: var(--ink-soft); }

/* Worksheet card */
.sheet { border: 2.5px solid var(--ink); border-radius: 22px; overflow: hidden; background: var(--paper); }
.bar { background: var(--c); color: var(--ink); text-align: center; font: 700 17px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; padding: 11px 14px; border-bottom: 2.5px solid var(--ink); }
.body { padding: 20px; display: grid; gap: 16px; }
.lead { font: 700 clamp(24px, 6vw, 32px)/1.1 var(--display); margin: 0; text-align: center; text-wrap: balance; }
.note { font: 400 20px/1.3 var(--hand); color: var(--ink-soft); margin: 0; text-align: center; }

label.f { display: grid; gap: 4px; font: 800 13px var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
input[type=text] { font: 700 17px var(--body); color: var(--ink); border: 2.5px solid var(--ink); border-radius: 12px; padding: 10px 12px; width: 100%; background: var(--paper); }
input[type=text]:focus-visible { outline: 3px solid var(--c); outline-offset: 2px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 460px) { .grid2 { grid-template-columns: 1fr; } }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { flex: 1; min-width: 64px; }

button { font-family: inherit; }
.chipbtn { border: 2.5px solid var(--ink); background: var(--paper); color: var(--ink); border-radius: 12px; padding: 9px 10px; font: 800 15px var(--body); cursor: pointer; }
.chipbtn[aria-pressed="true"] { background: var(--c); }
.btn {
  font: 700 19px/1 var(--display); color: var(--ink); background: var(--c); border: 2.5px solid var(--ink);
  border-radius: 999px; padding: 14px 26px; cursor: pointer; box-shadow: 0 4px 0 var(--ink); justify-self: center;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn.ghost { background: var(--paper); }
.btn.sm { font-size: 15px; padding: 9px 16px; box-shadow: 0 3px 0 var(--ink); }
button:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

/* Game choice cards */
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 460px) { .modes { grid-template-columns: 1fr; } }
.mode {
  text-align: left; border: 2.5px solid var(--ink); border-radius: 18px; background: var(--msoft);
  padding: 14px; cursor: pointer; display: grid; gap: 4px; color: var(--ink); transition: transform .12s;
}
.mode:hover { transform: rotate(-1deg) translateY(-2px); }
.mode .t { font: 700 21px/1.1 var(--display); display: flex; align-items: center; gap: 8px; }
.mode .t i { width: 14px; height: 14px; border-radius: 50%; background: var(--m); border: 2px solid var(--ink); flex: none; }
.mode .d { font-size: 14.5px; color: var(--ink-soft); }
.mode .p { font: 400 18px var(--hand); color: var(--ink); }
div.mode { cursor: default; }
div.mode:hover { transform: none; }

/* Timed play */
.timer { display: grid; gap: 6px; }
.timer .row { display: flex; justify-content: space-between; font: 700 18px var(--display); font-variant-numeric: tabular-nums; }
.track { height: 16px; border: 2.5px solid var(--ink); border-radius: 999px; overflow: hidden; background: var(--paper); }
.fill { height: 100%; background: var(--c); width: 100%; }
.timer.hurry .fill { background: var(--red); }
.word {
  border: 2.5px dashed var(--ink); border-radius: 18px; background: var(--c-soft);
  padding: 26px 16px; text-align: center; display: grid; gap: 8px; min-height: 170px; align-content: center;
}
.word .cat { justify-self: center; font: 800 12px var(--body); letter-spacing: .1em; text-transform: uppercase; background: var(--paper); border: 2px solid var(--ink); border-radius: 999px; padding: 3px 10px; }
.word .w { font: 700 clamp(30px, 9vw, 46px)/1.05 var(--display); text-wrap: balance; overflow-wrap: anywhere; }
.word .w.ar { font-family: var(--arabic); font-weight: 800; line-height: 1.3; }
.word .sub { font: 700 16px var(--body); color: var(--ink-soft); }
.signals { margin: 0; padding: 12px 14px 12px 32px; border: 2px dashed var(--ink); border-radius: 14px; background: var(--c-soft); display: grid; gap: 4px; font-size: 15px; }
.actions { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }
.actions .btn { justify-self: stretch; }
.skip { background: var(--paper) !important; }
.got { background: var(--green) !important; color: #fff !important; text-shadow: 0 1px 0 rgba(0,0,0,.25); }

/* Trivia */
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 460px) { .opts { grid-template-columns: 1fr; } }
.opt { border: 2.5px solid var(--ink); border-radius: 14px; background: var(--paper); padding: 13px 12px; font: 800 16px/1.25 var(--body); color: var(--ink); text-align: left; cursor: pointer; min-height: 54px; }
.opt:hover:not(:disabled) { background: var(--c-soft); }
.opt:disabled { cursor: default; opacity: .55; }
.opt.right { background: var(--green-soft); border-color: var(--green); opacity: 1; }
.opt.wrong { background: #ffe1e3; border-color: var(--red); opacity: 1; }
.q { font: 700 clamp(22px, 5.5vw, 28px)/1.15 var(--display); margin: 0; text-wrap: balance; }
.prog { display: flex; justify-content: space-between; font: 800 13px var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }

/* Reverse trivia */
.answer { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 12px; }
.answer span { font: 800 15px var(--body); }
.answer strong { border: 2.5px solid var(--ink); background: var(--c-soft); border-radius: 12px; padding: 14px; text-align: center; font: 700 clamp(26px, 7vw, 36px)/1.1 var(--display); }
.judge { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.judge .btn { justify-self: stretch; padding-inline: 8px; font-size: 16px; }

/* Summary lists */
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.list li { display: flex; gap: 10px; align-items: baseline; border-bottom: 2px dashed #e4dde9; padding-bottom: 6px; }
.list li b { width: 22px; flex: none; text-align: center; }
.ok { color: var(--green); } .no { color: var(--red); }

.podium { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.podium li { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 10px; border: 2.5px solid var(--ink); border-radius: 14px; padding: 10px 14px; background: var(--tsoft); }
.podium .rk { font: 700 22px var(--display); }
.podium .nm { font: 700 18px var(--display); overflow-wrap: anywhere; min-width: 0; }
.podium .sc { font: 700 24px var(--display); font-variant-numeric: tabular-nums; }

.stickers { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
.sticky { font: 400 21px/1.15 var(--hand); padding: 10px 14px; border: 2px solid var(--ink); background: var(--yellow-soft); transform: rotate(-3deg); box-shadow: 3px 3px 0 var(--ink); }
.sticky.p { background: var(--pink-soft); transform: rotate(2.5deg); }
.sticky.g { background: var(--green-soft); transform: rotate(-1.5deg); }

#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } .mode:hover { transform: none; } }
</style>

</head>

  { q:"How many colours are in a rainbow?", o:["5","6","7","8"], a:2 },
  { q:"Mix blue and yellow paint. What do you get?", o:["Purple","Green","Orange","Brown"], a:1 },
  { q:"In Subway Surfers, who chases you?", o:["A police car","The inspector and his dog","A train driver","A giant pigeon"], a:1 },
  { q:"Which toy do you launch while shouting “Let it rip!”?", o:["Yo-yo","Tazos","Beyblade","Bakugan"], a:2 },
  { q:"What is the first Harry Potter book?", o:["The Chamber of Secrets","The Philosopher's Stone","The Goblet of Fire","The Prisoner of Azkaban"], a:1 },
  { q:"In Toy Story, what is the cowboy's name?", o:["Buzz","Woody","Jessie","Rex"], a:1 },
  { q:"What is the lion cub's name in The Lion King?", o:["Nala","Mufasa","Simba","Kovu"], a:2 },
  { q:"In Finding Nemo, what does Dory struggle with?", o:["Swimming","Remembering things","Talking","Seeing"], a:1 }
];
const REVERSE = ["Twenty","2006","Pink","Nutella","Sour","The donkey","Seven","Spacetoon","Bye-bye","Recess","Balloons",
  "Never","Everything","Blue","The last one","Forever young","Three wishes","Musical chairs","Both of them","Sprinkles"];

const MODES = {
  explain: { name:"Explain It", c:"--pink", s:"--pink-soft", d:"Describe the word or person without saying it. Your team shouts guesses.", p:"+1 per correct guess", deck:() => EXPLAIN },
  act:     { name:"Act It Out", c:"--yellow", s:"--yellow-soft", d:"No talking, no sounds. Act it out and let your team guess.", p:"+2 per correct guess", deck:() => ACT },
  movies:  { name:"Arabic Movies", c:"--blue", s:"--blue-soft", d:"Describe the Egyptian movie without saying any word of its name.", p:"+1 per correct guess", pool:"movies", deck:() => MOVIES.map(m => [m[0], "Arabic movie", m[1]]) },
  kataflam:{ name:"Kataflam", c:"--orange", s:"--orange-soft", d:"Act out the movie name with no talking. Your team guesses the movie.", p:"+2 per correct guess", pool:"movies", deck:() => MOVIES.map(m => [m[0], "Kataflam", m[1]]) },
  trivia:  { name:"Trivia", c:"--purple", s:"--purple-soft", d:"Three multiple-choice questions. Your team agrees on one answer.", p:"+1 per right answer" },
  reverse: { name:"Reverse Trivia", c:"--green", s:"--green-soft", d:"You get the answer. Your team makes up a question that fits.", p:"+1 valid · +2 super creative" }
};
const TEAM_COLORS = [["--pink","--pink-soft"],["--yellow","--yellow-soft"],["--purple","--purple-soft"],["--green","--green-soft"]];
const DEFAULT_NAMES = ["Team Party Hats","Team Sour Candy","Team Piñata","Team Balloons"];

/* ---------- State ---------- */
let S = { phase:"setup", teams:DEFAULT_NAMES.slice(0,2).map(n => ({ name:n, score:0 })), turn:0, secs:60 };
let R = null; // current round
const pools = {};
const KEY = "khadija-bbt-v1";
try { const saved = JSON.parse(localStorage.getItem(KEY) || "null"); if (saved && saved.teams) { S = saved; if (!["setup","pick","end"].includes(S.phase)) S.phase = "pick"; } } catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify({ phase:S.phase, teams:S.teams, turn:S.turn, secs:S.secs })); } catch (e) {} }

function draw(key, list){
  if (!pools[key] || !pools[key].length) pools[key] = shuffle(list.map((_, i) => i));
  return list[pools[key].pop()];
}
function shuffle(a){ for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const $ = id => document.getElementById(id);
const sheet = $("sheet"), root = document.documentElement;
function tint(c, s){ root.style.setProperty("--c", `var(${c})`); root.style.setProperty("--c-soft", `var(${s})`); }
const team = () => S.teams[S.turn];

/* ---------- Scoreboard ---------- */
function renderBoard(){
  const show = S.phase !== "setup";
  $("board").hidden = !show;
  if (!show) return;
  $("teams").innerHTML = S.teams.map((t, i) => `
    <div class="team ${i === S.turn && S.phase !== "end" ? "now" : ""}" style="--tc:var(${TEAM_COLORS[i][0]});--tsoft:var(${TEAM_COLORS[i][1]})">
      <span class="nm">${esc(t.name)}</span><span class="sc">${t.score}</span>
      <span class="adj"><button id="minus-${i}" aria-label="Take a point from ${esc(t.name)}">−</button><button id="plus-${i}" aria-label="Give a point to ${esc(t.name)}">+</button></span>
    </div>`).join("");
  S.teams.forEach((t, i) => {
    $("minus-" + i).onclick = () => { t.score = Math.max(0, t.score - 1); save(); renderBoard(); };
    $("plus-" + i).onclick = () => { t.score++; save(); renderBoard(); };
  });
  $("turnline").textContent = S.phase === "end" ? "Game over!" : `Up now: ${team().name}`;
  $("endgame").hidden = S.phase === "end";
}
$("endgame").onclick = () => { stopTimer(); S.phase = "end"; save(); render(); };

/* ---------- Screens ---------- */
function render(){ renderBoard(); ({ setup, pick, ready, play, trivia, reverse, turnEnd, end })[S.phase](); }

function setup(){
  tint("--pink", "--pink-soft");
  const n = S.teams.length;
  sheet.innerHTML = `
    <div class="bar">Set up the teams</div>
    <div class="body">
      <label class="f">How many teams?<div class="seg">${[2,3,4].map(k => `<button class="chipbtn" id="count-${k}" aria-pressed="${k === n}">${k} teams</button>`).join("")}</div></label>
      <div class="grid2">${S.teams.map((t, i) => `<label class="f">Team ${i + 1}<input type="text" id="team-name-${i}" value="${esc(t.name)}" maxlength="24"></label>`).join("")}</div>
      <label class="f">Seconds per turn<div class="seg">${[45,60,90].map(k => `<button class="chipbtn" id="secs-${k}" aria-pressed="${k === S.secs}">${k}s</button>`).join("")}</div></label>
      <div class="modes">${Object.values(MODES).map(m => `
        <div class="mode" style="--m:var(${m.c});--msoft:var(${m.s})"><span class="t"><i></i>${m.name}</span><span class="d">${m.d}</span><span class="p">${m.p}</span></div>`).join("")}</div>
      <div class="stickers"><span class="sticky">you got this!</span><span class="sticky p">bye-bye teens ♡</span></div>
      <button class="btn" id="start">Start the game</button>
    </div>`;
  const keepNames = () => S.teams.forEach((t, i) => { const v = $("team-name-" + i).value.trim(); t.name = v || DEFAULT_NAMES[i]; });
  [2,3,4].forEach(k => $("count-" + k).onclick = () => {
    keepNames();
    while (S.teams.length < k) S.teams.push({ name:DEFAULT_NAMES[S.teams.length], score:0 });
    S.teams.length = k; setup();
  });
  [45,60,90].forEach(k => $("secs-" + k).onclick = () => { keepNames(); S.secs = k; setup(); });
  $("start").onclick = () => { keepNames(); unlockAudio(); S.teams.forEach(t => t.score = 0); S.turn = 0; S.phase = "pick"; save(); render(); };
}

function pick(){
  tint(TEAM_COLORS[S.turn][0], TEAM_COLORS[S.turn][1]);
  sheet.innerHTML = `
    <div class="bar">${esc(team().name)}, you're up!</div>
    <div class="body">
      <p class="lead">Pick your game</p>
      <div class="modes">${Object.entries(MODES).map(([k, m]) => `
        <button class="mode" id="mode-${k}" style="--m:var(${m.c});--msoft:var(${m.s})"><span class="t"><i></i>${m.name}</span><span class="d">${m.d}</span><span class="p">${m.p}</span></button>`).join("")}</div>
    </div>`;
  Object.keys(MODES).forEach(k => $("mode-" + k).onclick = () => {
    unlockAudio();
    const m = MODES[k]; tint(m.c, m.s);
    R = { mode:k, pts:0, log:[] };
    if (k === "trivia") { R.qs = [0,1,2].map(() => draw("trivia", TRIVIA)); R.i = 0; S.phase = "trivia"; }
    else if (k === "reverse") { R.qs = [0,1,2].map(() => draw("reverse", REVERSE)); R.i = 0; S.phase = "reverse"; }
    else S.phase = "ready";
    render();
  });
}

const acting = () => R.mode === "act" || R.mode === "kataflam";
const drawWord = () => draw(MODES[R.mode].pool || R.mode, MODES[R.mode].deck());
function ready(){
  const m = MODES[R.mode];
  sheet.innerHTML = `
    <div class="bar">${m.name}</div>
    <div class="body">
      <p class="lead">Pass the phone to your ${acting() ? "actor" : "explainer"}</p>
      <p class="note">Only they look at the screen! ${S.secs} seconds. ${acting() ? "No talking, no sounds, no mouthing words." : "Don't say the name or any word in it."}</p>
      ${R.mode === "kataflam" ? `<ul class="signals">
        <li>Pretend to crank an old film camera so they know it's a movie.</li>
        <li>Hold up fingers to show how many words are in the name.</li>
        <li>Hold up fingers again to show which word you're acting now.</li>
        <li>Tug your ear for “sounds like”, then act a word that rhymes.</li>
      </ul>` : ""}
      <button class="btn" id="go">Start the ${S.secs}-second timer</button>
    </div>`;
  $("go").onclick = () => { S.phase = "play"; R.end = performance.now() + S.secs * 1000; R.word = drawWord(); render(); startTimer(); };
}

function play(){
  const m = MODES[R.mode];
  sheet.innerHTML = `
    <div class="bar">${m.name} · ${esc(team().name)}</div>
    <div class="body">
      <div class="timer" id="timer"><div class="row"><span id="left">${S.secs}s</span><span>Guessed: <span id="count">${R.log.filter(l => l.ok).length}</span></span></div><div class="track"><div class="fill" id="fill"></div></div></div>
      <div class="word"><span class="cat">${esc(R.word[1])}</span>${R.word[2] ? `<span class="w ar" lang="ar" dir="rtl">${esc(R.word[0])}</span><span class="sub">${esc(R.word[2])}</span>` : `<span class="w">${esc(R.word[0])}</span>`}</div>
      <div class="actions"><button class="btn skip" id="skip">Skip</button><button class="btn got" id="got">Got it! ✓</button></div>
    </div>`;
  $("skip").onclick = () => next(false);
  $("got").onclick = () => next(true);
  tickTimer();
}
function next(ok){
  R.log.push({ w:R.word[2] ? `${R.word[0]} (${R.word[2]})` : R.word[0], ok });
  if (ok) { R.pts += acting() ? 2 : 1; burst(18); beep(880, .08); }
  R.word = drawWord();
  play();
}

let timerId = null, lastBeep = null;
function startTimer(){ stopTimer(); lastBeep = null; timerId = setInterval(tickTimer, 100); }
function stopTimer(){ if (timerId) clearInterval(timerId); timerId = null; }
function tickTimer(){
  if (S.phase !== "play") return;
  const ms = Math.max(0, R.end - performance.now()), s = Math.ceil(ms / 1000);
  const left = $("left"), fill = $("fill"), box = $("timer");
  if (left) left.textContent = s + "s";
  if (fill) fill.style.width = (ms / (S.secs * 1000) * 100) + "%";
  if (box) box.classList.toggle("hurry", s <= 10);
  if (s <= 5 && s > 0 && s !== lastBeep) { lastBeep = s; beep(520, .1); }
  if (ms <= 0) { stopTimer(); beep(200, .5); finishTurn(); }
}

function trivia(){
  const Q = R.qs[R.i];
  sheet.innerHTML = `
    <div class="bar">Trivia · ${esc(team().name)}</div>
    <div class="body">
      <div class="prog"><span>Question ${R.i + 1} of 3</span><span>+${R.pts} this turn</span></div>
      <h2 class="q">${esc(Q.q)}</h2>
      <div class="opts">${Q.o.map((o, k) => `<button class="opt" id="opt-${R.i}-${k}">${esc(o)}</button>`).join("")}</div>
      <div id="after" style="display:grid;gap:12px"></div>
    </div>`;
  Q.o.forEach((_, k) => $(`opt-${R.i}-${k}`).onclick = () => {
    const ok = k === Q.a;
    Q.o.forEach((_, n) => { const b = $(`opt-${R.i}-${n}`); b.disabled = true; if (n === Q.a) b.classList.add("right"); else if (n === k) b.classList.add("wrong"); });
    R.log.push({ w:Q.q, ok });
    if (ok) { R.pts++; burst(30); beep(880, .1); } else beep(220, .25);
    $("after").innerHTML = `<p class="note">${ok ? "Correct! +1" : "Not this time. The answer was " + esc(Q.o[Q.a]) + "."}</p><button class="btn" id="tnext">${R.i < 2 ? "Next question" : "Finish turn"}</button>`;
    $("tnext").onclick = () => { R.i++; R.i < 3 ? trivia() : finishTurn(); };
    $("tnext").focus({ preventScroll:true });
  });
}

function reverse(){
  const A = R.qs[R.i];
  sheet.innerHTML = `
    <div class="bar">Reverse Trivia · ${esc(team().name)}</div>
    <div class="body">
      <div class="prog"><span>Answer ${R.i + 1} of 3</span><span>+${R.pts} this turn</span></div>
      <div class="answer"><span>The answer is:</span><strong>${esc(A)}</strong></div>
      <p class="note">Your team says a question that fits. Everyone else judges!</p>
      <div class="judge">
        <button class="btn ghost" id="j0">Nope · 0</button>
        <button class="btn" id="j1" style="background:var(--yellow)">Valid · +1</button>
        <button class="btn" id="j2" style="background:var(--green);color:#fff">Creative! · +2</button>
      </div>
    </div>`;
  [0,1,2].forEach(p => $("j" + p).onclick = () => {
    R.pts += p; R.log.push({ w:A, ok:p > 0, p });
    if (p) { burst(p * 20); beep(p === 2 ? 1046 : 880, .1); }
    R.i++; R.i < 3 ? reverse() : finishTurn();
  });
}

function finishTurn(){
  team().score += R.pts; S.phase = "turnEnd"; save(); render();
  if (R.pts) burst(60 + R.pts * 10);
}
function turnEnd(){
  const m = MODES[R.mode], nextTeam = S.teams[(S.turn + 1) % S.teams.length];
  sheet.innerHTML = `
    <div class="bar">${R.mode === "trivia" || R.mode === "reverse" ? "Turn over!" : "Time's up!"}</div>
    <div class="body">
      <p class="lead">${esc(team().name)} scored +${R.pts}</p>
      ${R.log.length ? `<ul class="list">${R.log.map(l => `<li><b class="${l.ok ? "ok" : "no"}">${l.ok ? "✓" : "✗"}</b><span>${esc(l.w)}${l.p === 2 ? " · creative!" : ""}</span></li>`).join("")}</ul>` : `<p class="note">No words this round. Next time!</p>`}
      <button class="btn" id="nextteam">Next up: ${esc(nextTeam.name)}</button>
    </div>`;
  $("nextteam").onclick = () => { S.turn = (S.turn + 1) % S.teams.length; S.phase = "pick"; save(); render(); };
}

function end(){
  tint("--pink", "--pink-soft");
  const ranked = S.teams.map((t, i) => ({ ...t, i })).sort((a, b) => b.score - a.score);
  const top = ranked[0].score, winners = ranked.filter(t => t.score === top);
  sheet.innerHTML = `
    <div class="bar">Final scores</div>
    <div class="body">
      <p class="lead">${winners.length > 1 ? "It's a tie! 🎉" : esc(winners[0].name) + " wins! 🎉"}</p>
      <ol class="podium">${ranked.map((t, r) => `<li style="--tsoft:var(${TEAM_COLORS[t.i][1]})"><span class="rk">${t.score === top ? "★" : r + 1}</span><span class="nm">${esc(t.name)}</span><span class="sc">${t.score}</span></li>`).join("")}</ol>
      <div class="stickers"><span class="sticky p">Happy 20th, Khadija! ♡</span><span class="sticky g">bye-bye teens, hello twenties</span></div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn ghost" id="back">Keep playing</button>
        <button class="btn" id="again">New game</button>
      </div>
    </div>`;
  $("back").onclick = () => { S.phase = "pick"; save(); render(); };
  $("again").onclick = () => { S.teams.forEach(t => t.score = 0); S.turn = 0; S.phase = "setup"; save(); render(); };
  burst(260);
}

/* ---------- Sound ---------- */
let ac = null;
function unlockAudio(){ try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume && ac.resume(); } catch (e) {} }
function beep(f, d){
  if (!ac) return;
  try { const o = ac.createOscillator(), g = ac.createGain(); o.type = "triangle"; o.frequency.value = f;
    g.gain.setValueAtTime(.15, ac.currentTime); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d); } catch (e) {}
}

/* ---------- Confetti ---------- */
const cv = $("confetti"), cx = cv.getContext("2d");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const COLS = ["#ff3d8b","#ffc928","#9b6bf0","#4fae3a","#3d8bff","#ff8a2b","#f0414f"];
let bits = [], running = false;
function size(){ cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
addEventListener("resize", size); size();
function burst(n){
  if (reduce) return;
  for (let k = 0; k < n; k++) bits.push({ x:innerWidth * (.15 + Math.random() * .7), y:innerHeight * .3, vx:(Math.random() - .5) * 10,
    vy:-Math.random() * 11 - 3, r:Math.random() * 6 + 4, c:COLS[k % COLS.length], a:Math.random() * 6, s:(Math.random() - .5) * .3, round:Math.random() < .3 });
  if (!running) { running = true; requestAnimationFrame(tick); }
}
function tick(){
  const d = devicePixelRatio; cx.clearRect(0, 0, cv.width, cv.height);
  bits.forEach(b => { b.vy += .28; b.x += b.vx; b.y += b.vy; b.vx *= .99; b.a += b.s;
    cx.save(); cx.translate(b.x * d, b.y * d); cx.rotate(b.a); cx.fillStyle = b.c;
    if (b.round) { cx.beginPath(); cx.arc(0, 0, b.r * d / 2, 0, 7); cx.fill(); } else cx.fillRect(-b.r * d / 2, -b.r * d / 4, b.r * d, b.r * d / 2);
    cx.restore(); });
  bits = bits.filter(b => b.y < innerHeight + 30);
  if (bits.length) requestAnimationFrame(tick); else { running = false; cx.clearRect(0, 0, cv.width, cv.height); }
}

render();
</script>

</body>
</html>
